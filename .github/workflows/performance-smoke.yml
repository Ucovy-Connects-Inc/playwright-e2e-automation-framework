name: Performance smoke (manual)
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Approved QA base URL (non-production)
        required: true
        type: string
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run bounded performance checks
        env:
          PERF_BASE_URL: ${{ inputs.target_url }}
          PERF_API_PATH: /
          PERF_BROWSER_PATH: /
          PERF_USERS: '2'
          PERF_ITERATIONS: '5'
        run: npx playwright test tests/performance --project=chromium-ai-visual --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            test-results/performance/
            test-results/results.json
            test-results/html-report/
          if-no-files-found: ignore
